services:
  homelabarr:
    # image: ghcr.io/dpawson905/homelabarr:latest
    # To build from source instead, comment out 'image' above and uncomment:
    build: .
    container_name: homelabarr
    restart: unless-stopped
    ports:
      - "3575:3575"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      # To show additional drives/mounts in the System Stats widget, bind-mount them (read-only):
      # - /mnt/data/media:/mnt/data/media:ro
      # For the k8s-autoupdater widget (only useful if you run k8s-autoupdater on the host),
      # bind-mount its SQLite state DB read-only. WAL mode on the source DB makes
      # concurrent reads safe alongside the service's writes.
      - /opt/k8s-autoupdater/state.db:/opt/k8s-autoupdater/state.db:ro
    environment:
      - NODE_ENV=production
      - PORT=3575
      # Uncomment and set to persist encryption key across rebuilds:
      # - ENCRYPTION_SECRET=change-me-to-a-long-random-string
      # Set to "true" if accessing via HTTPS (e.g. behind a reverse proxy):
      # - SECURE_COOKIES=true
